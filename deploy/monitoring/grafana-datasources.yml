# Grafana auto-provisioned data sources (loaded on startup — no UI setup needed).
# Grafana runs on host networking, so it reaches both over 127.0.0.1.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
  - name: Loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
