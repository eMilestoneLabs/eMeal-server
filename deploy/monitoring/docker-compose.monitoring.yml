# eMeal — OPTIONAL observability stack (Track C). 100% open-source, zero license.
# Fully ADDITIVE: separate compose project, separate volumes, NO app code change,
# NO change to the data-services compose. Remove anytime with:  docker compose
# -f docker-compose.monitoring.yml down   (data volumes persist unless -v).
#
# SECURITY: every UI/metrics port is bound to 127.0.0.1 only (UFW also blocks
# 9090/9100/9121/9187/8080/3001/3002 from the public). Reach the UIs via SSH tunnel:
#   ssh -L 3002:127.0.0.1:3002 -L 3001:127.0.0.1:3001 emeal@<server>
#   then open http://localhost:3002 (Grafana) and http://localhost:3001 (Uptime Kuma)
#
# Setup:  cp .env.monitoring.example .env  &&  edit creds  &&  docker compose -f docker-compose.monitoring.yml up -d
version: '3.9'

x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: emeal_prometheus
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:9090:9090']

  node-exporter:
    image: prom/node-exporter:latest
    container_name: emeal_node_exporter
    restart: unless-stopped
    logging: *default-logging
    network_mode: host           # needs host namespace for true host CPU/RAM/disk
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=:9100'   # UFW blocks 9100 publicly; Prometheus scrapes via host-gateway
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: emeal_cadvisor
    restart: unless-stopped
    logging: *default-logging
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: ['127.0.0.1:8080:8080']

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: emeal_postgres_exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}?sslmode=disable"
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:9187:9187']

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: emeal_redis_exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR: "redis://host.docker.internal:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:9121:9121']

  grafana:
    image: grafana/grafana-oss:latest
    container_name: emeal_grafana
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}"
      GF_SERVER_HTTP_PORT: '3000'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:3002:3000']

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: emeal_uptime_kuma
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - uptime_kuma_data:/app/data
    ports: ['127.0.0.1:3001:3001']

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
