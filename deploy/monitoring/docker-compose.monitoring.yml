# eMeal — OPTIONAL observability stack (Track C). 100% open-source, zero license.
# Fully ADDITIVE: separate compose project, separate volumes, NO app change.
# Remove anytime:  docker compose -f docker-compose.monitoring.yml down
#
# NETWORKING: Postgres/Redis are published on the host's 127.0.0.1 ONLY, which a
# bridge container cannot reach (and UFW drops the gateway path). So the components
# that must reach them — Prometheus + node/pg/redis exporters + Grafana — run on
# HOST networking and talk over 127.0.0.1 (loopback is never filtered by UFW).
# Each daemon binds 127.0.0.1 explicitly; UFW also blocks these ports externally.
# cAdvisor + Uptime-Kuma stay on the bridge with loopback-published ports.
#
# mem_limit on every service bounds the observability stack (caps ~3-5x observed use).
#
# Reach the UIs via SSH tunnel:
#   ssh -L 3002:127.0.0.1:3002 -L 3001:127.0.0.1:3001 emeal@<server>
# Setup:  ln -s ../../.env.production .env  &&  docker compose -f docker-compose.monitoring.yml up -d

x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: emeal_prometheus
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    network_mode: host
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=127.0.0.1:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: emeal_node_exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    network_mode: host
    pid: host
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=127.0.0.1:9100'
    volumes:
      - '/:/host:ro,rslave'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: emeal_cadvisor
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports: ['127.0.0.1:8080:8080']

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: emeal_postgres_exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    network_mode: host
    command: ['--web.listen-address=127.0.0.1:9187']   # loopback-only (UFW also blocks it)
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?sslmode=disable"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: emeal_redis_exporter
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    network_mode: host
    environment:
      REDIS_ADDR: "redis://127.0.0.1:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: "127.0.0.1:9121"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: emeal_grafana
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}"
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "3002"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # auto-provision Prometheus + Loki data sources (no UI clicking needed)
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: emeal_uptime_kuma
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 384m
    volumes:
      - uptime_kuma_data:/app/data
    ports: ['127.0.0.1:3001:3001']

  # ── Centralized logs: Loki (store) + Promtail (shipper) ────────────────────
  loki:
    image: grafana/loki:latest
    container_name: emeal_loki
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - loki_data:/loki
    ports: ['127.0.0.1:3100:3100']   # Grafana (host net) reaches it here

  promtail:
    image: grafana/promtail:latest
    container_name: emeal_promtail
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro   # all container logs
      - ../../logs:/pm2logs:ro                                     # PM2 app logs
      - promtail_positions:/tmp

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  loki_data:
  promtail_positions:
