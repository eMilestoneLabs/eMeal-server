# Prometheus scrape config for the eMeal observability stack.
# Prometheus runs on HOST networking, so every target is reached over 127.0.0.1
# (loopback — never filtered by UFW). cAdvisor is bridge but publishes on 127.0.0.1.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: emeal-prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node          # host CPU / RAM / disk / network
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: cadvisor      # per-container CPU / mem / IO
    static_configs:
      - targets: ['127.0.0.1:8080']

  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']

  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']

  # MinIO native metrics (optional, later): set MINIO_PROMETHEUS_AUTH_TYPE=public on
  # the minio service, then add a job for 127.0.0.1:9000 /minio/v2/metrics/cluster.
  # App-level /metrics intentionally not scraped (backend is FROZEN, no prom-client).
