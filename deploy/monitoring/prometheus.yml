# Prometheus scrape config for the eMeal observability stack.
# Targets are reached on the monitoring compose network (service names) except
# node-exporter, which runs in the host namespace and is reached via host-gateway.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: emeal-prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node          # host CPU / RAM / disk / network (UFW-protected port)
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: cadvisor      # per-container CPU / mem / IO (postgres, redis, minio, app-adjacent)
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # MinIO exposes native Prometheus metrics. Enable later (needs a metrics token):
  #   set MINIO_PROMETHEUS_AUTH_TYPE=public on the minio service, then add:
  # - job_name: minio
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ['host.docker.internal:9000']

  # App-level /metrics is intentionally NOT scraped: the backend is FROZEN and has
  # no prom-client endpoint. Host + container + DB + Redis exporters above already
  # cover the infrastructure. An app /metrics endpoint is a post-launch additive option.
