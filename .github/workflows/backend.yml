name: Backend Verification Pipeline

on:
  push:
    branches:
      - eMeal-server

  pull_request:
    branches:
      - eMeal-server

env:
  NODE_VERSION: 20
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emeal_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  JWT_SECRET: test-jwt-secret
  REFRESH_TOKEN_SECRET: test-refresh-secret
  BULL_BOARD_SECRET: test-bull-secret

jobs:
  backend-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emeal_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test -- --runInBand

      - name: Build Backend
        run: npm run build

      - name: Start Backend Server
        run: |
          npm run start:dev &
          sleep 35

      - name: Verify Health Endpoint
        run: |
          curl --fail http://localhost:3000/api/v1/health

      - name: Run B2 Verification
        run: |
          chmod +x B2_VERIFY.sh
          ./B2_VERIFY.sh

      - name: Run B3 Verification
        run: |
          chmod +x B3_VERIFY.sh
          ./B3_VERIFY.sh

      - name: Run B4 Verification
        run: |
          chmod +x B4_VERIFY.sh
          ./B4_VERIFY.sh

      - name: Run B5 Verification
        run: |
          chmod +x B5_VERIFY.sh
          ./B5_VERIFY.sh

      - name: Run B6 Verification
        run: |
          chmod +x B6_VERIFY.sh
          ./B6_VERIFY.sh

      - name: Run B7 Verification
        run: |
          chmod +x B7_VERIFY.sh
          ./B7_VERIFY.sh

      - name: Verify No Console Logs
        run: |
          if grep -R "console.log" src/; then
            echo "console.log found"
            exit 1
          fi

      - name: Verify Versioned WebSocket Events
        run: |
          if ! grep -R "\.v1" src/realtime/; then
            echo "Non-versioned websocket event found"
            exit 1
          fi

      - name: Verify Pagination Contract
        run: |
          if grep -R "\"items\"" src/features/; then
            echo "Forbidden pagination key detected"
            exit 1
          fi

      - name: Verify Dynamic slotKey Governance
        run: |
          if grep -R "enum MealType" src/; then
            echo "MealType enum detected"
            exit 1
          fi

      - name: Verify No organizationId In DTOs
        run: |
          if grep -R "organizationId" src/features/*/dto/; then
            echo "organizationId found in DTOs"
            exit 1
          fi

      - name: Verify No Raw Prisma Leakage
        run: |
          if grep -R "return prisma" src/features/*/controllers/; then
            echo "Raw Prisma leakage detected"
            exit 1
          fi

      - name: Backend Verification Complete
        run: |
          echo "======================================="
          echo " MealAttend Backend Verification PASS "
          echo "======================================="
