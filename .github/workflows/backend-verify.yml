name: Backend Verification Pipeline

on:
  push:
    branches:
      - eMeal-server
  pull_request:
    branches:
      - eMeal-server

env:
  NODE_VERSION: 20
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emeal_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  JWT_ACCESS_SECRET: test-jwt-access-secret-64-chars-minimum-padding-here-xxxxxxxx
  JWT_REFRESH_SECRET: test-jwt-refresh-secret-64-chars-minimum-padding-here-xxxxxxx
  REFRESH_TOKEN_SECRET: test-refresh-secret
  BULL_BOARD_SECRET: test-bull-secret
  NODE_ENV: test

jobs:
  backend-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emeal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: TypeScript Compile Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test -- --runInBand

      - name: Build Backend
        run: npm run build

      - name: Start Backend Server
        run: |
          npm run start:prod &
          sleep 20

      - name: Verify Health Endpoint
        run: |
          curl --fail http://localhost:3000/api/v1/health

      # ── Governance Contract Checks ──────────────────────────────────────────

      - name: Verify No console.log in Source
        run: |
          if grep -rn "console\.log" src/; then
            echo "❌ console.log found in src/ — use LoggerService instead"
            exit 1
          fi
          echo "✅ No console.log found"

      - name: Verify Versioned WebSocket Events (.v1 suffix)
        run: |
          if ! grep -rq "\.v1" src/realtime/; then
            echo "❌ No versioned WebSocket events found — all events must use .v1 suffix"
            exit 1
          fi
          echo "✅ Versioned WebSocket events present"

      - name: Verify Pagination Contract (no 'items' key)
        run: |
          if grep -rn '"items"' src/features/; then
            echo "❌ Forbidden pagination key 'items' detected — must use 'data'"
            exit 1
          fi
          echo "✅ Pagination contract clean"

      - name: Verify Dynamic slotKey Governance (no MealType enum)
        run: |
          if grep -rn "enum MealType" src/; then
            echo "❌ MealType enum detected — meal slots must remain free-form slotKey strings"
            exit 1
          fi
          echo "✅ No MealType enum — slotKey governance preserved"

      - name: Verify organizationId Not in DTOs (must come from JWT only)
        run: |
          if grep -rn "organizationId" src/features/*/dto/; then
            echo "❌ organizationId found in DTOs — must be extracted from JWT, never trusted from client"
            exit 1
          fi
          echo "✅ organizationId not in DTOs — multi-tenant isolation preserved"

      - name: Verify No Raw Prisma Leakage in Controllers
        run: |
          if grep -rn "return prisma" src/features/*/controllers/ src/features/*/controller*.ts 2>/dev/null; then
            echo "❌ Raw Prisma model returned directly from controller — use serializers"
            exit 1
          fi
          echo "✅ No raw Prisma leakage in controllers"

      - name: Verify No Hardcoded Secrets in Source
        run: |
          if grep -rn "secret\|password\|apiKey" src/ --include="*.ts" | grep -v "process\.env\|configService\|@IsString\|description\|comment\|\/\/"; then
            echo "❌ Possible hardcoded secret detected in src/"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Verify EventType Not Enum (must be free-form string)
        run: |
          if grep -rn "enum EventType" src/; then
            echo "❌ EventType enum detected — event types must remain free-form strings"
            exit 1
          fi
          echo "✅ No EventType enum — governance preserved"

      # ── Final Summary ───────────────────────────────────────────────────────

      - name: Backend Verification Complete
        run: |
          echo "============================================"
          echo "  eMeal Backend Verification PASSED ✅"
          echo "  B1–B7 production source — all checks OK"
          echo "============================================"
