name: eMeal Server Workflow

# Production-grade pipeline. Push or PR runs, in order:
#
#   1. Code Quality      integrity - lint - type check - security        (parallel)
#   2. Feature Tests     one parallel job per feature (Auth, Groups, ...)
#   3. Build & Compile   prisma generate - tsc - nest build - PM2 config
#   4. Integration & E2E real Postgres + Redis, smoke + system journeys
#   5. Release Gate      single required status - green only if all pass
#
# Stages 1+2 must pass before 3+4 start (fail-fast). The gate aggregates
# everything into one required check for branch protection. Tests are fully
# isolated from production (ephemeral containers, test-only env).

on:
  push:
    branches: [eMeal-server, main]
  pull_request:
    branches: [eMeal-server, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emeal_test
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  JWT_ACCESS_SECRET: test-jwt-access-secret-64-chars-minimum-padding-here-xxxxxxxx
  JWT_REFRESH_SECRET: test-jwt-refresh-secret-64-chars-minimum-padding-here-xxxxxxx
  REFRESH_TOKEN_SECRET: test-refresh-secret
  BULL_BOARD_SECRET: test-bull-secret

jobs:
  # ───────────────────────────── 1. CODE QUALITY ─────────────────────────────
  quality:
    name: Code Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: Repo Integrity,   task: integrity }
          - { check: Lint,             task: lint }
          - { check: Type Check,       task: typecheck }
          - { check: Security & Governance, task: governance }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        if: matrix.task == 'typecheck'
        run: npx prisma generate
      - name: Repo integrity scan
        if: matrix.task == 'integrity'
        run: node scripts/ci/integrity-check.js
      - name: ESLint
        if: matrix.task == 'lint'
        run: npm run lint
      - name: TypeScript type check
        if: matrix.task == 'typecheck'
        run: npx tsc --noEmit
      - name: Security & governance scan
        if: matrix.task == 'governance'
        run: bash scripts/ci/governance-scan.sh

  # ───────────────────────────── 2. FEATURE TESTS ────────────────────────────
  feature-tests:
    name: Feature Tests / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: Auth,               path: "features/auth/" }
          - { feature: Organizations,      path: "features/organizations/" }
          - { feature: Groups,             path: "features/groups/" }
          - { feature: Meals & Schedules,  path: "features/meals/" }
          - { feature: Attendance,         path: "features/attendance/" }
          - { feature: Events,             path: "features/events/" }
          - { feature: Dashboard,          path: "features/dashboard/" }
          - { feature: Exports,            path: "features/exports/" }
          - { feature: Notifications,      path: "features/notifications/" }
          - { feature: Workers,            path: "workers/tests/" }
          - { feature: Platform Contracts, path: "common/tests/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run ${{ matrix.feature }} tests
        run: npx jest --runInBand --passWithNoTests --testPathPattern "${{ matrix.path }}"

  # ───────────────────────────── 3. BUILD & COMPILE ──────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Compile (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Production build (nest build)
        run: npm run build
      - name: Verify build artifact
        run: test -f dist/main.js && echo "dist/main.js produced"
      - name: Validate PM2 ecosystem config
        run: node -e "require('./ecosystem.config.js'); console.log('PM2 ecosystem config OK')"
      - name: Docker image build (if Dockerfile present)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t emeal-server:ci .
          else
            echo "::notice::No Dockerfile yet (B11) - skipping docker image build"
          fi

  # ───────────────────────────── 4. INTEGRATION & E2E ────────────────────────
  integration:
    name: Integration & E2E
    runs-on: ubuntu-latest
    needs: [quality, feature-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emeal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      # Ephemeral test DB only. Switch to `prisma migrate deploy` once an initial
      # migration is committed (prisma/migrations) in B11.
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Full unit suite against live DB + Redis
        run: npx jest --runInBand --passWithNoTests
      - name: End-to-end suite (smoke + system journey)
        run: npm run test:e2e

  # ───────────────────────────── 5. RELEASE GATE ─────────────────────────────
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, feature-tests, build, integration]
    steps:
      - name: Aggregate stage results
        run: |
          echo "Code Quality : ${{ needs.quality.result }}"
          echo "Feature Tests: ${{ needs.feature-tests.result }}"
          echo "Build        : ${{ needs.build.result }}"
          echo "Integration  : ${{ needs.integration.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.feature-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::Release gate failed - one or more stages did not pass."
            exit 1
          fi
          echo "Release gate passed - backend is merge-safe and deployable."
