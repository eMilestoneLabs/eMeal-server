name: eMeal Server Workflow

# Production-grade pipeline. On every push / PR it runs the full test pyramid:
#
#   1. Code Quality    integrity · lint · type check · security        (parallel)
#   2. Sanity Checks   fast cross-feature contract invariants (no DB)
#   3. Unit Tests      one parallel job per feature (Auth, Groups, ...)
#   4. Build & Compile prisma generate · tsc · nest build · PM2 config
#   5. Smoke Tests     boots the app on real Postgres+Redis, checks health/edges
#   6. Integration     multi-module API journey on real Postgres+Redis
#   7. Release Gate    one required status — green only if everything passed
#
# Downstream stages declare `needs:`, so if an upstream stage fails the rest are
# SKIPPED (fail-fast) and the Release Gate goes red. Tests are fully isolated
# from production (ephemeral service containers, test-only env vars).

on:
  push:
    branches: [eMeal-server, main]
  pull_request:
    branches: [eMeal-server, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emeal_test
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  JWT_ACCESS_SECRET: test-jwt-access-secret-64-chars-minimum-padding-here-xxxxxxxx
  JWT_REFRESH_SECRET: test-jwt-refresh-secret-64-chars-minimum-padding-here-xxxxxxx
  REFRESH_TOKEN_SECRET: test-refresh-secret
  BULL_BOARD_SECRET: test-bull-secret

jobs:
  # ───────────────────────────── 1. CODE QUALITY ─────────────────────────────
  quality:
    name: Code Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: Repo Integrity,        task: integrity }
          - { check: Lint,                  task: lint }
          - { check: Type Check,            task: typecheck }
          - { check: Security & Governance, task: governance }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.task }}" in
            integrity)  node scripts/ci/integrity-check.js ;;
            lint)       npm run lint ;;
            typecheck)  npx prisma generate && npx tsc --noEmit ;;
            governance) bash scripts/ci/governance-scan.sh ;;
          esac

  # ───────────────────────────── 2. SANITY CHECKS ────────────────────────────
  sanity:
    name: Sanity Checks
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Cross-feature contract invariants (B1-B9, no DB)
        run: npx jest --runInBand --testPathPattern "common/tests/phase-verification"

  # ───────────────────────────── 3. UNIT TESTS ───────────────────────────────
  unit-tests:
    name: Unit Tests / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: Auth,               path: "features/auth/" }
          - { feature: Organizations,      path: "features/organizations/" }
          - { feature: Groups,             path: "features/groups/" }
          - { feature: Meals & Schedules,  path: "features/meals/" }
          - { feature: Attendance,         path: "features/attendance/" }
          - { feature: Events,             path: "features/events/" }
          - { feature: Dashboard,          path: "features/dashboard/" }
          - { feature: Exports,            path: "features/exports/" }
          - { feature: Notifications,      path: "features/notifications/" }
          - { feature: Workers,            path: "workers/tests/" }
          - { feature: Platform Contracts, path: "common/tests/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run ${{ matrix.feature }} unit tests
        run: npx jest --runInBand --passWithNoTests --testPathPattern "${{ matrix.path }}"

  # ───────────────────────────── 4. BUILD & COMPILE ──────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Compile (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Production build (nest build)
        run: npm run build
      - name: Verify build artifact
        run: test -f dist/main.js && echo "dist/main.js produced"
      - name: Validate PM2 ecosystem config
        run: node -e "require('./ecosystem.config.js'); console.log('PM2 ecosystem config OK')"
      - name: Docker image build (if Dockerfile present)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t emeal-server:ci .
          else
            echo "::notice::No Dockerfile yet (B11) - skipping docker image build"
          fi

  # ───────────────────────────── 5. SMOKE TESTS ──────────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: emeal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Smoke test (app boot + health + auth/validation edges)
        run: npm run test:e2e -- --testPathPattern "smoke"

  # ───────────────────────────── 6. INTEGRATION TESTS ────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [quality, unit-tests]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: emeal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      # Ephemeral test DB only. Switch to `prisma migrate deploy` once an initial
      # migration is committed (prisma/migrations) in B11.
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Multi-module API journey (B1-B5 on real DB + Redis)
        run: npm run test:e2e -- --testPathPattern "system"

  # ───────────────────────────── 7. RELEASE GATE ─────────────────────────────
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, sanity, unit-tests, build, smoke, integration]
    steps:
      - name: Aggregate stage results
        run: |
          echo "Code Quality   : ${{ needs.quality.result }}"
          echo "Sanity Checks  : ${{ needs.sanity.result }}"
          echo "Unit Tests     : ${{ needs.unit-tests.result }}"
          echo "Build & Compile: ${{ needs.build.result }}"
          echo "Smoke Tests    : ${{ needs.smoke.result }}"
          echo "Integration    : ${{ needs.integration.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.sanity.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::Release gate failed - one or more stages did not pass."
            exit 1
          fi
          echo "Release gate passed - backend is merge-safe and deployable."
