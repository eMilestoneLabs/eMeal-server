name: eMeal Server Workflow

# ─────────────────────────────────────────────────────────────────────────────
# Advanced, production-grade CI/CD. Every push / PR runs the full test pyramid
# and uploads downloadable evidence (coverage, test results, export files) so any
# future code change is verified feature-by-feature and nothing breaks silently.
#
#   1. Code Quality         integrity · lint · type check · security      (parallel)
#   1b. Hygiene             circular deps (madge) · duplication (jscpd) · dead code (knip)
#   2. Feature Tests        one job per FEATURE — unit tests + coverage artifact
#   2b. CodeQL              static security analysis (merged from codeql.yml — SARIF
#                           to the GitHub Security tab; free on public repos)
#   2c. SAST & Secrets      Semgrep OSS rules + Gitleaks + Trivy (all open-source)
#   2d. Dependency Health   npm audit (blocking, prod high+) · OSV · licenses · outdated
#   3. Export Verification  generates real XLSX/CSV, uploads as artifacts
#   4. Build & Compile      prisma generate · tsc · nest build · PM2
#   5. Sanity Testing       cross-feature invariants + report artifact
#   6. Smoke Testing        boots the app on real Postgres+Redis, critical edges
#   7. Integration Testing  multi-module API journey on real Postgres+Redis
#   8. Performance Testing  load test + server RSS/CPU + DB audit, HTML report
#   9. Release Gate         one required status — green only if everything passed
#
# Downstream stages declare `needs:`; an upstream failure skips the rest
# (fail-fast) and the Release Gate goes red. All tests are isolated from
# production (ephemeral service containers, test-only env vars).
#
# TOOLING LICENSE NOTE — every scanner here is free + open-source + commercially
# usable: ESLint(MIT) madge(MIT) jscpd(MIT) knip(ISC) Semgrep CE(LGPL-2.1, OSS
# rule packs) Gitleaks(MIT) Trivy(Apache-2.0) OSV-Scanner(Apache-2.0) jest(MIT)
# supertest(MIT) exceljs(MIT) autocannon-style custom perf harness (in-repo, MIT).
# CodeQL: the action + CLI are free for PUBLIC repositories (private repos need
# GitHub Advanced Security). The former standalone codeql.yml (incl. its weekly
# cron) is merged into this pipeline as the `codeql` job — single source of truth.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [eMeal-server, main]
  pull_request:
    branches: [eMeal-server, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/emeal_test
  REDIS_HOST: localhost
  REDIS_PORT: "6379"
  JWT_ACCESS_SECRET: test-jwt-access-secret-64-chars-minimum-padding-here-xxxxxxxx
  JWT_REFRESH_SECRET: test-jwt-refresh-secret-64-chars-minimum-padding-here-xxxxxxx
  REFRESH_TOKEN_SECRET: test-refresh-secret
  BULL_BOARD_SECRET: test-bull-secret

jobs:
  # ───────────────────────────── 1. CODE QUALITY ─────────────────────────────
  quality:
    name: Code Quality / ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: Repo Integrity,        task: integrity }
          - { check: Lint,                  task: lint }
          - { check: Type Check,            task: typecheck }
          - { check: Security & Governance, task: governance }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Run ${{ matrix.check }}
        run: |
          case "${{ matrix.task }}" in
            integrity)  node scripts/ci/integrity-check.js ;;
            lint)       npm run lint ;;
            typecheck)  npx prisma generate && npx tsc --noEmit ;;
            governance) bash scripts/ci/governance-scan.sh ;;
          esac


  # ─────────────────── 1b. ARCHITECTURE & CODE HYGIENE ───────────────────────
  # madge: circular dependency detection (verified clean — blocking).
  # jscpd: copy-paste detection, fails above 5% duplication (currently 0.33%).
  # knip: dead code / unused dependency REPORT (advisory artifact, non-blocking
  #       — NestJS DI hides many usages from static analysis).
  hygiene:
    name: Architecture & Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Circular dependency check (madge)
        run: npx -y madge@8 --circular --extensions ts src
      - name: Duplicate code check (jscpd, fail >5%)
        run: |
          mkdir -p artifacts/hygiene
          npx -y jscpd@4 src --min-tokens 100 --threshold 5 \
            --reporters console,json --output artifacts/hygiene
      - name: Dead code / unused dependency report (knip — advisory)
        run: |
          npx -y knip@5 --no-exit-code > artifacts/hygiene/knip-report.txt 2>&1 || true
          echo "knip report captured (advisory only)"
      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hygiene-reports
          path: artifacts/hygiene
          retention-days: 14

  # ──────────────── 2b. CODEQL (merged from codeql.yml) ──────────────────────
  # Static security analysis for JS/TS source AND the workflow files themselves.
  # SARIF results appear in the repository Security tab. Part of the release gate.
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: actions, build-mode: none }
          - { language: javascript-typescript, build-mode: none }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ──────────────── 2c. SAST, SECRETS & FILESYSTEM SCANNING ──────────────────
  # Semgrep CE (OSS rule packs) — blocks on ERROR-severity findings.
  # Gitleaks — blocks on committed secrets (.gitleaks.toml allowlists the
  #            documented CI-only test env values).
  # Trivy   — filesystem scan, blocks on CRITICAL vulns/misconfigs; full
  #           HIGH+ report uploaded as an artifact.
  security-sast:
    name: Security / SAST & Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Semgrep scan (OSS rules, fail on ERROR severity)
        run: |
          mkdir -p artifacts/security
          python3 -m pip install --quiet --user semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan \
            --config p/default --config p/security-audit --config p/owasp-top-ten \
            --severity ERROR --error \
            --sarif --output artifacts/security/semgrep.sarif \
            --metrics=off src scripts test
      - name: Upload Semgrep SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/semgrep.sarif
          category: semgrep
        continue-on-error: true
      - name: Gitleaks secret scan (blocking)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path artifacts/security/gitleaks.sarif
      - name: Trivy filesystem scan (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: artifacts/security/trivy.sarif
      - name: Trivy HIGH+ advisory report (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: artifacts/security/trivy-high-report.txt
      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: artifacts/security
          retention-days: 14

  # ──────────────────────── 2d. DEPENDENCY HEALTH ────────────────────────────
  # npm audit — BLOCKING on high/critical advisories in PRODUCTION deps.
  # OSV-Scanner / outdated / license summary — advisory report artifacts.
  dependency-health:
    name: Dependency Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: npm audit (production deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit / outdated / license reports (advisory)
        run: |
          mkdir -p artifacts/deps
          npm audit --json > artifacts/deps/npm-audit-full.json || true
          npm outdated > artifacts/deps/outdated.txt || true
          npx -y license-checker-rseidelsohn@4 --production --summary \
            > artifacts/deps/license-summary.txt || true
          npx -y license-checker-rseidelsohn@4 --production --csv \
            > artifacts/deps/licenses.csv || true
      - name: OSV-Scanner advisory report (lockfile)
        run: |
          OSV_VERSION=1.9.1
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner --lockfile package-lock.json --format json \
            > artifacts/deps/osv-report.json || true
          echo "OSV advisory report captured"
      - name: Upload dependency health reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-health-reports
          path: artifacts/deps
          retention-days: 14

  # ───────────────────────── 2. FEATURE TESTS (per feature) ──────────────────
  # One parallel job per feature. Each runs that feature's unit tests with
  # coverage and uploads coverage + test-result JSON as a downloadable artifact.
  feature-tests:
    name: Feature Tests / ${{ matrix.feature }}
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { feature: Authentication,     slug: authentication, path: "features/auth/" }
          - { feature: Organizations,      slug: organizations,  path: "features/organizations/" }
          - { feature: Groups,             slug: groups,         path: "features/groups/" }
          - { feature: Meals & Schedules,  slug: meals,          path: "features/meals/" }
          - { feature: Attendance,         slug: attendance,     path: "features/attendance/" }
          - { feature: Events,             slug: events,         path: "features/events/" }
          - { feature: Dashboard,          slug: dashboard,      path: "features/dashboard/" }
          - { feature: Exports,            slug: exports,        path: "features/exports/" }
          - { feature: Notifications,      slug: notifications,  path: "features/notifications/" }
          - { feature: Realtime & Workers, slug: realtime,       path: "workers/tests/" }
          - { feature: Platform Contracts, slug: platform,       path: "common/tests/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run ${{ matrix.feature }} unit tests + coverage
        run: |
          mkdir -p "coverage/${{ matrix.slug }}"
          npx jest --runInBand --passWithNoTests \
            --testPathPattern "${{ matrix.path }}" \
            --coverage \
            --coverageDirectory "coverage/${{ matrix.slug }}" \
            --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=json-summary \
            --collectCoverageFrom "${{ matrix.path }}**/*.ts" \
            --json --outputFile "coverage/${{ matrix.slug }}/jest-results.json" || JEST_EXIT=$?
          node scripts/ci/jest-report.js "coverage/${{ matrix.slug }}/jest-results.json" "coverage/${{ matrix.slug }}/report.html" || true
          exit ${JEST_EXIT:-0}
      - name: Upload ${{ matrix.feature }} test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-report-${{ matrix.slug }}
          path: coverage/${{ matrix.slug }}
          retention-days: 14

  # ───────────── 2b. UNIT TESTS (consolidated, all features, coverage) ────────
  # Runs the full feature-wise unit suite once and uploads a single consolidated
  # coverage report (browsable HTML) + human-readable test report.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: feature-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run full unit suite (all features) + coverage
        run: |
          mkdir -p coverage/unit
          npx jest --runInBand \
            --coverage \
            --coverageDirectory coverage/unit \
            --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=html --coverageReporters=json-summary \
            --json --outputFile coverage/unit/jest-results.json || JEST_EXIT=$?
          node scripts/ci/jest-report.js coverage/unit/jest-results.json coverage/unit/unit-test-report.html || true
          exit ${JEST_EXIT:-0}
      - name: Upload unit test coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/unit
          retention-days: 14

  # ─────────────────────── 3. EXPORT VERIFICATION (artifacts) ─────────────────
  export-verification:
    name: Export Verification
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate + validate real XLSX / CSV exports
        run: node scripts/ci/export-verify.js
      - name: Upload export files (XLSX + CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-files
          path: artifacts/exports
          retention-days: 14

  # ───────────────────────────── 4. BUILD & COMPILE ──────────────────────────
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Compile (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Production build (nest build)
        run: npm run build
      - name: Verify build artifact
        run: test -f dist/main.js && echo "dist/main.js produced"
      - name: Validate PM2 ecosystem config
        run: node -e "require('./ecosystem.config.js'); console.log('PM2 ecosystem config OK')"
      - name: Docker image build (if Dockerfile present)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t emeal-server:ci .
          else
            echo "::notice::No Dockerfile yet (B11) - skipping docker image build"
          fi

  # ───────────────────────────── 5. SANITY TESTING ───────────────────────────
  sanity:
    name: Sanity Testing
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Cross-feature contract invariants (B1-B9) + report
        run: |
          mkdir -p artifacts/sanity
          npx jest --runInBand \
            --testPathPattern "common/tests/phase-verification" \
            --json --outputFile artifacts/sanity/sanity-report.json || JEST_EXIT=$?
          node scripts/ci/jest-report.js artifacts/sanity/sanity-report.json artifacts/sanity/sanity-report.html || true
          exit ${JEST_EXIT:-0}
      - name: Upload sanity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-report
          path: artifacts/sanity
          retention-days: 14

  # ───────────────────────────── 6. SMOKE TESTING ────────────────────────────
  smoke:
    name: Smoke Testing
    runs-on: ubuntu-latest
    needs: [quality, feature-tests]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: emeal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Smoke test (app boot + health + critical edges)
        run: npm run test:e2e -- --testPathPattern "smoke"

  # ───────────────────────────── 7. INTEGRATION TESTING ──────────────────────
  integration:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: [quality, feature-tests]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: emeal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      # Ephemeral test DB only. Switch to `prisma migrate deploy` once an initial
      # migration is committed (prisma/migrations) in B11.
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Multi-module API journey (real DB + Redis)
        run: npm run test:e2e -- --testPathPattern "system"

  # ───────────────────────────── 8. PERFORMANCE TESTING ──────────────────────
  # Boots the built app on real Postgres+Redis, runs a black-box load test
  # (latency percentiles, throughput, error/timeout rate), samples server RSS+CPU
  # from /proc (leak signal), runs a static DB/Prisma performance audit, and
  # uploads a detailed HTML performance report. Guardrail SLO only (won't flake).
  performance:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [quality, feature-tests, integration]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: emeal_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Sync schema to test database
        run: npx prisma db push --skip-generate
      - name: Build for performance run
        run: npm run build
      - name: Install WebSocket probe client (perf job only, not saved)
        run: npm install socket.io-client@4 --no-save --no-audit --no-fund
      - name: Start server + run performance profile
        env:
          PERF_SOAK_SECONDS: "120"
        run: |
          mkdir -p artifacts/performance
          # Raise the open-file limit so the high-concurrency stress phase can open
          # its sockets without ECONNREFUSED/EMFILE on the shared runner.
          ulimit -n 65535 || true
          node --trace-gc --heapsnapshot-signal=SIGUSR1 dist/main > /tmp/server.out 2> /tmp/gc.log & echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/v1/health >/dev/null && break
            sleep 2
          done
          node scripts/ci/perf-test.js http://localhost:3000 "$(cat /tmp/server.pid)" artifacts/performance /tmp/gc.log || PERF_EXIT=$?
          kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          exit ${PERF_EXIT:-0}
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: artifacts/performance
          retention-days: 14

  # ───────────────────────────── 9. RELEASE GATE ─────────────────────────────
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, hygiene, codeql, security-sast, dependency-health, feature-tests, unit-tests, export-verification, build, sanity, smoke, integration, performance]
    steps:
      - name: Aggregate stage results
        run: |
          echo "Code Quality        : ${{ needs.quality.result }}"
          echo "Hygiene             : ${{ needs.hygiene.result }}"
          echo "CodeQL              : ${{ needs.codeql.result }}"
          echo "SAST & Secrets      : ${{ needs.security-sast.result }}"
          echo "Dependency Health   : ${{ needs.dependency-health.result }}"
          echo "Feature Tests       : ${{ needs.feature-tests.result }}"
          echo "Unit Tests          : ${{ needs.unit-tests.result }}"
          echo "Export Verification : ${{ needs.export-verification.result }}"
          echo "Build & Compile     : ${{ needs.build.result }}"
          echo "Sanity Testing      : ${{ needs.sanity.result }}"
          echo "Smoke Testing       : ${{ needs.smoke.result }}"
          echo "Integration Testing : ${{ needs.integration.result }}"
          echo "Performance Testing : ${{ needs.performance.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.hygiene.result }}" != "success" ] || \
             [ "${{ needs.codeql.result }}" != "success" ] || \
             [ "${{ needs.security-sast.result }}" != "success" ] || \
             [ "${{ needs.dependency-health.result }}" != "success" ] || \
             [ "${{ needs.feature-tests.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.export-verification.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.sanity.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.performance.result }}" != "success" ]; then
            echo "::error::Release gate failed - one or more stages did not pass."
            exit 1
          fi
          echo "Release gate passed - backend is merge-safe and deployable."
