# Nginx — emilestone.com (Contabo VPS 10)
# api.emilestone.com  -> NestJS (PM2) on 127.0.0.1:3000  (REST + Socket.IO)
# cdn.emilestone.com  -> MinIO S3 API on 127.0.0.1:9000  (meal images / avatars)
#
# This file is SELF-CONTAINED and copy-safe onto the LIVE server: it references
# the existing Let's Encrypt certs + certbot's TLS options, so `nginx -t` passes
# without re-running certbot. BEFORE applying on the live box:
#     sudo cp nginx/emilestone.conf /etc/nginx/sites-available/emilestone
#     sudo nginx -t && sudo systemctl reload nginx        # rollback: restore prior file + reload
# If cert paths differ, check: sudo certbot certificates.
#
# Additive vs. the previous repo file (matches/locks in the live behavior):
#   • limit_req_zone moved to http context (was invalid inside server{}) → rate-limit now valid.
#   • cdn long-cache headers made explicit (immutable; keys are timestamped = safe).
#   • server_tokens off; + TLS hardening via certbot's options-ssl-nginx.conf.

# Rate-limit zone MUST live in http context (sites-enabled files are included in http{}).
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server_tokens off;

upstream emeal_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}
upstream emeal_minio {
    server 127.0.0.1:9000;
    keepalive 32;
}

# ---- api.emilestone.com ----
server {
    listen 80;
    server_name api.emilestone.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api.emilestone.com;

    ssl_certificate     /etc/letsencrypt/live/api.emilestone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.emilestone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # TLSv1.2/1.3 + strong ciphers (certbot-managed)

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types application/json text/plain application/javascript;
    client_max_body_size 5M;

    # Keep client connections (incl. HTTP/2) warm across natural usage gaps.
    # Default 75s meant a phone tapping a tab a minute later paid a FULL fresh
    # TLS handshake (~1.5-2s on a high-RTT link) on every screen. 650s pairs
    # with the app's 600s client-side idle timeout (client closes first).
    keepalive_timeout 650s;
    keepalive_requests 10000;

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://emeal_backend;
        proxy_http_version 1.1;
        # WebSocket (Socket.IO) upgrade — required for realtime dashboards
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ---- cdn.emilestone.com (MinIO meal images / avatars) ----
server {
    listen 80;
    server_name cdn.emilestone.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name cdn.emilestone.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.emilestone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.emilestone.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5M;

    # Same keepalive as the api vhost: an avatar/image burst a few minutes after
    # the last one should not pay a fresh TLS handshake on a high-RTT link.
    keepalive_timeout 650s;
    keepalive_requests 10000;

    location / {
        # MinIO is S3: the FIRST path segment is the bucket. Public image URLs are
        # clean (cdn.emilestone.com/org/.../file.jpg — no bucket), so Nginx MUST
        # inject the bucket here. The trailing-slash URI on proxy_pass replaces the
        # matched "/" → /emeal-images/, turning /org/x.jpg into /emeal-images/org/x.jpg.
        # WITHOUT this, MinIO treats "org" as the bucket and returns 403. (emeal-images
        # = $MINIO_BUCKET; change both together if the bucket is ever renamed.)
        proxy_pass http://emeal_minio/emeal-images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;

        # Image keys are content-addressed (…/{timestamp}.jpg) so a NEW upload =
        # NEW URL. Long-cache + immutable is therefore safe AND makes avatar/meal
        # updates appear instantly (the URL changes; the old URL stays cacheable).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
