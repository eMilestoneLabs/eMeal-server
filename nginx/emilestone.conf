# Nginx — emilestone.com (Contabo VPS 10, IP 5.189.153.205)
# api.emilestone.com  -> NestJS (PM2) on 127.0.0.1:3000  (REST + Socket.IO)
# cdn.emilestone.com  -> MinIO S3 API on 127.0.0.1:9000  (meal images)
# Run `certbot --nginx -d api.emilestone.com -d cdn.emilestone.com` to add the
# ssl_certificate lines automatically; the HTTP->HTTPS redirect blocks are below.

upstream emeal_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}
upstream emeal_minio {
    server 127.0.0.1:9000;
    keepalive 32;
}

# ---- api.emilestone.com ----
server {
    listen 80;
    server_name api.emilestone.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api.emilestone.com;

    # ssl_certificate / ssl_certificate_key added by certbot

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types application/json text/plain application/javascript;
    client_max_body_size 5M;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://emeal_backend;
        proxy_http_version 1.1;
        # WebSocket (Socket.IO) upgrade — required for realtime dashboards
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

# ---- cdn.emilestone.com (MinIO meal images) ----
server {
    listen 80;
    server_name cdn.emilestone.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name cdn.emilestone.com;

    # ssl_certificate / ssl_certificate_key added by certbot

    client_max_body_size 5M;
    location / {
        proxy_pass http://emeal_minio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }
}
